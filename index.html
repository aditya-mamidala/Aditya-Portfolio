<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aditya Mamidala | Portfolio</title>

    <meta name="description"
          content="Aditya Mamidala - B.Tech CSE Student, Cybersecurity Learner and Developer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        /* =========================
           GLOBAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #050816;
            --bg2: #0b1026;
            --card: rgba(17, 24, 52, 0.72);
            --text: #f5f7ff;
            --muted: #a9b2ca;
            --cyan: #00d9ff;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --line: rgba(255,255,255,0.10);
        }

        body {
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(0,217,255,0.13), transparent 25%),
                radial-gradient(circle at 90% 20%, rgba(139,92,246,0.15), transparent 25%),
                radial-gradient(circle at 50% 90%, rgba(236,72,153,0.10), transparent 30%),
                var(--bg);

            color: var(--text);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1120px, 90%);
            margin: auto;
        }

        section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .section-title h2 {
            font-size: 38px;
            font-weight: 800;
        }

        .section-title span {
            color: var(--cyan);
        }

        .section-title p {
            color: var(--muted);
            margin-top: 10px;
        }

        /* =========================
           BACKGROUND
        ========================== */

        .orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .orb.one {
            background: var(--cyan);
            top: 15%;
            left: -150px;
        }

        .orb.two {
            background: var(--purple);
            right: -150px;
            bottom: 10%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-50px);
            }
        }

        /* =========================
           NAVBAR
        ========================== */

        nav {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            background: rgba(5,8,22,0.75);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--line);
        }

        .nav-inner {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
            -webkit-background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: #dce2f4;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--cyan);
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 100px;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        .hero-text {
            animation: slideLeft 1s ease forwards;
        }

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .hello {
            display: inline-block;
            color: var(--cyan);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 75px);
            line-height: 1.05;
            font-weight: 800;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
            -webkit-background-clip: text;
            color: transparent;
            background-size: 200%;
            animation: gradientMove 4s linear infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 200%;
            }
        }

        .typing {
            margin-top: 20px;
            font-size: 22px;
            color: #d9e0f5;
            min-height: 35px;
        }

        .hero-description {
            color: var(--muted);
            line-height: 1.8;
            max-width: 650px;
            margin-top: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 25px;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
            border: 1px solid var(--line);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            color: white;
            box-shadow: 0 0 25px rgba(0,217,255,0.25);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.04);
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        /* =========================
           PROFILE PHOTO
        ========================== */

        .profile-area {
            display: flex;
            justify-content: center;
            animation: slideRight 1s ease forwards;
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .profile-wrapper {
            position: relative;
            width: 330px;
            height: 330px;
        }

        .profile-wrapper::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                var(--cyan),
                var(--purple),
                var(--pink),
                var(--cyan)
            );
            background-size: 300%;
            animation: rotateGradient 5s linear infinite;
            z-index: -1;
        }

        @keyframes rotateGradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        .profile-wrapper::after {
            content: "";
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            border: 1px solid rgba(0,217,255,0.25);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,100% {
                transform: scale(0.95);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        .profile-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            border: 7px solid var(--bg);
        }

        /* =========================
           ABOUT
        ========================== */

        .about-card {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            transition: 0.4s;
        }

        .about-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0,217,255,0.35);
        }

        .about-card p {
            color: var(--muted);
            line-height: 1.9;
            font-size: 16px;
        }

        .about-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 30px;
        }

        .info-box {
            padding: 25px;
            text-align: center;
            border-radius: 18px;
            background: rgba(255,255,255,0.035);
            border: 1px solid var(--line);
        }

        .info-box h3 {
            color: var(--cyan);
            margin-bottom: 7px;
        }

        .info-box p {
            font-size: 13px;
        }

        /* =========================
           SKILLS
        ========================== */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .skill-card {
            padding: 30px 20px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            transition: 0.4s;
        }

        .skill-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--cyan);
            box-shadow: 0 15px 40px rgba(0,217,255,0.08);
        }

        .skill-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .skill-card h3 {
            margin-bottom: 10px;
        }

        .skill-card p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           PROJECTS
        ========================== */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .project-card {
            padding: 32px;
            border-radius: 24px;
            background: linear-gradient(
                145deg,
                rgba(17,24,52,0.85),
                rgba(8,12,30,0.9)
            );
            border: 1px solid var(--line);
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--cyan);
            filter: blur(90px);
            opacity: 0;
            transition: 0.4s;
            top: -70px;
            right: -70px;
        }

        .project-card:hover::before {
            opacity: 0.15;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0,217,255,0.35);
        }

        .project-number {
            color: var(--cyan);
            font-size: 13px;
            font-weight: 700;
        }

        .project-card h3 {
            font-size: 24px;
            margin: 12px 0;
        }

        .project-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .tag {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(0,217,255,0.08);
            border: 1px solid rgba(0,217,255,0.15);
            color: #9eeeff;
            font-size: 11px;
        }

        /* =========================
           CERTIFICATIONS
        ========================== */

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .cert-card {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 25px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            transition: 0.3s;
        }

        .cert-card:hover {
            transform: translateX(8px);
            border-color: var(--purple);
        }

        .cert-icon {
            min-width: 55px;
            height: 55px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            font-size: 25px;
            background: linear-gradient(
                135deg,
                rgba(0,217,255,0.18),
                rgba(139,92,246,0.18)
            );
        }

        .cert-card h3 {
            font-size: 16px;
        }

        .cert-card p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        /* =========================
           EDUCATION
        ========================== */

        .timeline {
            max-width: 750px;
            margin: auto;
            position: relative;
        }

        .timeline::before {
            content: "";
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(
                var(--cyan),
                var(--purple),
                var(--pink)
            );
        }

        .timeline-item {
            position: relative;
            padding-left: 65px;
            margin-bottom: 35px;
        }

        .timeline-dot {
            position: absolute;
            left: 10px;
            top: 5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 20px rgba(0,217,255,0.7);
        }

        .timeline-content {
            padding: 25px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--line);
        }

        .timeline-content h3 {
            color: white;
        }

        .timeline-content p {
            color: var(--muted);
            margin-top: 8px;
        }

        /* =========================
           CONTACT
        ========================== */

        .contact-card {
            text-align: center;
            padding: 60px 30px;
            border-radius: 28px;
            background:
                linear-gradient(
                    135deg,
                    rgba(0,217,255,0.08),
                    rgba(139,92,246,0.08)
                );
            border: 1px solid var(--line);
        }

        .contact-card h2 {
            font-size: 38px;
        }

        .contact-card p {
            color: var(--muted);
            margin: 15px auto 30px;
            max-width: 600px;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social {
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.04);
            transition: 0.3s;
        }

        .social:hover {
            background: rgba(0,217,255,0.1);
            border-color: var(--cyan);
            transform: translateY(-4px);
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            padding: 35px 0;
            text-align: center;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
        }

        footer span {
            color: var(--cyan);
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 850px) {

            .nav-links {
                display: none;
            }

            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-text {
                order: 2;
            }

            .profile-area {
                order: 1;
            }

            .buttons {
                justify-content: center;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .profile-wrapper {
                width: 250px;
                height: 250px;
            }

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .projects-grid,
            .cert-grid {
                grid-template-columns: 1fr;
            }

            .about-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {

            section {
                padding: 75px 0;
            }

            .section-title h2 {
                font-size: 30px;
            }

            .hero h1 {
                font-size: 45px;
            }

            .typing {
                font-size: 18px;
            }

            .skills-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .skill-card {
                padding: 22px 10px;
            }

            .about-card {
                padding: 25px;
            }

            .project-card {
                padding: 25px;
            }
        }

    </style>
</head>
